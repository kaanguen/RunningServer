<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111113"><title>RunningServer · ML2 Projekt</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<div class="app-bar"><div class="app-bar-inner"><a class="brand" href="/" aria-label="RunningServer Startseite">RunningServer<span>ML2 Projekt</span></a><nav aria-label="Hauptnavigation" id="navigation"></nav><div class="device"><span class="device-name">Magic Leap 2</span><span id="device-state" hidden></span></div></div></div>
<main><header><div><div class="eyebrow">MAGIC LEAP 2 / TRAINING</div><h1 id="page-title">Laufband</h1><p id="page-description">Pace und Begleiter für deine nächste Session vorbereiten.</p></div></header>
<section class="statusbar" aria-label="Verbindungsstatus"><div id="indicators"></div><div class="command-status"><span class="command-label">Letzter Befehl</span><div id="ack" role="status">Noch kein Befehl gesendet</div></div><button id="toggle-log" aria-expanded="false" aria-controls="event-panel">Protokoll anzeigen</button></section>
<p id="connection-notice" class="connection-notice" role="status"></p>
<div class="workspace log-collapsed"><section id="content" aria-label="Steuerung"></section><aside class="log-panel" id="event-panel"><div class="card-heading"><h2>Ereignisprotokoll</h2><span class="pill">DIAGNOSE</span></div><div class="log-tools"><label><input type="checkbox" id="autoscroll" checked> Auto-Scroll</label><button id="copy-log">Kopieren</button><button id="clear-log">Leeren</button></div><div id="log" role="log" aria-live="off"><div class="log-empty">Verbindungen und Befehle<br>erscheinen hier.</div></div></aside></div>
<div id="notice" role="alert" hidden></div>
<footer class="main-footer"><span>RunningServer <b>/</b> ML2 Projekt</span><span id="server-address"></span></footer>
</main></body></html>
